name: Update Files
on:
  push:
    branches:
      - main
      - update-ltg
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  generatetex:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [en, de]
        font: [default, times]
        listings: [listings, minted]
        enquotes: [csquotes]
        tweak_outerquote: [babel]
        todo: [pdfcomment]
        examples: [true]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: '${{ github.event.pull_request.head.ref }}'
          # PAT with workflow scope so the bot can push regenerated .github/workflows/check.yml
          token: ${{ secrets.GH_TOKEN_WRITE }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'generator-latex-template/package-lock.json'
      - name: Make generator available globally
        working-directory: ${{ github.workspace }}/generator-latex-template
        run: |
          npm install
          npm link
          npm install -g yo
      - run: mkdir /tmp/ltg
      - name: Generate template
        shell: bash
        working-directory: /tmp/ltg
        run: |
          yo $GITHUB_WORKSPACE/generator-latex-template/generators/app/index.js \
           --githubpublish\
           --docker=iot\
           --documentclass=lncs\
           --papersize=a4\
           --latexcompiler=both\
           --bibtextool=bibtex\
           --overleaf=true\
           --texlive=2026\
           --lang=${{ matrix.language }}\
           --font=${{ matrix.font }}\
           --listings=${{ matrix.listings }}\
           --enquotes=${{ matrix.enquotes }}\
           --tweakouterquote=${{ matrix.tweak_outerquote }}\
           --todo=${{ matrix.todo }}\
           --examples=${{ matrix.examples }}\
           --howtotext=false
        env:
          yeoman_test: false
      - name: Prepare files
        working-directory: /tmp/ltg
        run: |
          ls -la

          if [ "${{ matrix.language }}-${{ matrix.font }}-${{ matrix.listings }}" = "en-default-minted" ]; then
            # paper.tex + Makefile should be English, default font, minted
            echo "Keeping default paper.tex"
          else
            if [ "${{ matrix.language }}" = "en" ]; then
              LANG_PART=""
            else
              LANG_PART="-${{ matrix.language }}"
            fi

            if [ "${{ matrix.font }}" = "default" ]; then
              FONT_PART=""
            else
              FONT_PART="-newtx"
            fi

            if [ "${{ matrix.listings }}" = "listings" ]; then
              LISTINGS_PART="-basic-listings"
            else
              LISTINGS_PART=""
            fi

            mv paper.tex "paper${LANG_PART}${LISTINGS_PART}${FONT_PART}.tex"
            rm Makefile
          fi

          ls -la

          # remove files which should not be overwritten

          # .latexmkrc alternates between including and excluding "--shell-escape"; we just want to keep the minted + en version of it
          if [ "${{ matrix.listings }}" != "minted" ] || [ "${{ matrix.language }}" != "en" ]; then
            rm .latexmkrc
            rm -r .github/workflows
            rm commands.tex
          fi

          # the LICENSE of the repository should be kept
          rm LICENSE

          # Files are ready
          # Overwrite old versions in $GITHUB_WORKSPACE
          cp -r * $GITHUB_WORKSPACE
          cp -r .* $GITHUB_WORKSPACE

          # output current status
          cd ${{ github.workspace }}
          git status
          git diff
      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: 'Update files based on generated files by template generator'
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          push: false
      - name: Push changes
        run: |
          parallel --retries 10 --delay 9 ::: "git pull --rebase; git push"
  publish:
    runs-on: ubuntu-latest
    needs: [generatetex]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.ref }}'
          token: ${{ secrets.GH_TOKEN_WRITE }}
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys

      - name: Build all examples
        run: |
          for doc in paper*.tex; do
            latexmk "$doc"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## $doc" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            texlogsieve < "${doc%.tex}.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - run: |
          mkdir publish
          cp *.pdf publish/
          cp paper.tex publish/
          cp README.md publish/
          cp .github/_config.yml publish/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish
          path: publish/
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          enable_jekyll: true
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
